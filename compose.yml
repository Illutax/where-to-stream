services:
  w2s:
    container_name: w2s
    image: "w2s:${DOCKER_IMAGE_TAG}"
    volumes:
      - ./logs:/opt/app/logs:Z
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-mariadb}
      - MARIADB_URL=jdbc:mariadb://db:3306/w2s
      - MARIADB_USER=w2s
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-w2s}
#      - logging.level.org.springframework.web.servlet.DispatcherServlet=TRACE
      # Mounted under /w2s, and the reverse proxy in front of us must agree on three things.
      # The Caddyfile is `handle /w2s* { reverse_proxy w2s:8080 }`:
      #  - `handle`, not `handle_path`: the /w2s prefix arrives intact, which is what makes setting
      #    it here the right counterpart. Strip it at the proxy instead and Caddy would have to send
      #    X-Forwarded-Prefix -- which RemoteIpValve does not read, so that variant needs
      #    server.forward-headers-strategy=framework. Doing both yields /w2s/w2s.
      #  - `reverse_proxy` already sends X-Forwarded-For/-Proto/-Host; nothing to configure.
      #  - Caddy reaches us over the `webserver` network below, and Tomcat only trusts X-Forwarded-*
      #    from a peer in a private range. Docker's IPv4 pools qualify; an IPv6-enabled network
      #    would not, and the symptom is silent -- redirects quietly go out as http again.
      - server.servlet.context-path=/w2s
      - SERVER_SERVLET_SESSION_TIMEOUT=${W2S_SESSION_TIMEOUT:-30m}
      # W2S_ADMIN_USER / W2S_ADMIN_PASSWORD need no mapping: application.properties reads them
      # as placeholders, and env_file below hands them to the container.
      # Stable secret so remember-me / persistent login survives restarts (see .env.example).
      - W2S_SECURITY_REMEMBERME_KEY=${W2S_REMEMBER_ME_KEY}
      # Posters come from IMDb by default. Set TMDB_ENABLED=true + a key to use TMDB instead.
      - TMDB_ENABLED=${TMDB_ENABLED:-false}
      # Uncomment to log every poster resource fetched (lookup URL + image CDN URL).
      # Dotted form matches the DispatcherServlet example above; canonical env form is
#      - LOGGING_LEVEL_TECH_DOBLER_WHERE2STREAM_TITLECATALOG=DEBUG.
#      - logging.level.tech.dobler.where2stream.titlecatalog=DEBUG
#      - logging.level.org.hibernate.SQL=debug 
    env_file: .env
    depends_on:
      - db
    networks:
      - webserver
      - db
    restart: always

  db:
    container_name: db
    image: mariadb:lts-ubi
    environment:
      - MARIADB_DATABASE=w2s
      - MARIADB_USER=w2s
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-w2s}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-change-me}
    volumes:
      # Named volume (not a bind mount): the engine initialises it with the image's
      # mysql:mysql ownership and handles the rootless-Podman uid mapping, avoiding the
      # "Permission denied" a host-owned bind mount causes. The DB is a regenerable cache.
      - mariadb-data:/var/lib/mysql
    networks:
      - db
    restart: always

volumes:
  mariadb-data:

networks:
  webserver:
    name: webserver
    external: true
  db:

