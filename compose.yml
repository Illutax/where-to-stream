services:
  w2s:
    container_name: w2s
    image: "w2s:${DOCKER_IMAGE_TAG}"
    volumes:
      - ./logs:/opt/app/logs:Z
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-mariadb}
      - MARIADB_URL=jdbc:mariadb://db:3306/w2s
      - MARIADB_USER=w2s
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-w2s}
#      - logging.level.org.springframework.web.servlet.DispatcherServlet=TRACE
      - server.servlet.context-path=/w2s
      - SERVER_SERVLET_SESSION_TIMEOUT=${W2S_SESSION_TIMEOUT:-30m}
      # NOTE: property is initial-admin.USERNAME -> env must be ...INITIALADMIN_USERNAME.
      - W2S_SECURITY_INITIALADMIN_USERNAME=${W2S_ADMIN_USER:-admin}
      - W2S_SECURITY_INITIALADMIN_PASSWORD=${W2S_ADMIN_PASSWORD}
      # Stable secret so remember-me / persistent login survives restarts (see .env.example).
      - W2S_SECURITY_REMEMBERME_KEY=${W2S_REMEMBER_ME_KEY}
      # Posters come from IMDb by default. Set TMDB_ENABLED=true + a key to use TMDB instead.
      - TMDB_ENABLED=${TMDB_ENABLED:-false}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # Uncomment to log every poster resource fetched (lookup URL + image CDN URL).
      # Dotted form matches the DispatcherServlet example above; canonical env form is
#      - LOGGING_LEVEL_TECH_DOBLER_WHERE2STREAM_TITLECATALOG=DEBUG.
#      - logging.level.tech.dobler.where2stream.titlecatalog=DEBUG
    depends_on:
      - db
    networks:
      - webserver
      - db
    restart: always

  db:
    container_name: db
    image: mariadb:lts-ubi
    environment:
      - MARIADB_DATABASE=w2s
      - MARIADB_USER=w2s
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-w2s}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-change-me}
    volumes:
      # Named volume (not a bind mount): the engine initialises it with the image's
      # mysql:mysql ownership and handles the rootless-Podman uid mapping, avoiding the
      # "Permission denied" a host-owned bind mount causes. The DB is a regenerable cache.
      - mariadb-data:/var/lib/mysql
    networks:
      - db
    restart: always

volumes:
  mariadb-data:

networks:
  webserver:
    name: webserver
    external: true
  db:

