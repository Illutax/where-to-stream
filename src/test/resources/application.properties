spring.datasource.url=jdbc:h2:mem:testdb
# Schema is created by Liquibase (same as production); Hibernate does not touch it.
spring.jpa.hibernate.ddl-auto=none
# Match production (ADR-0011): keep Open-Session-in-View disabled in tests too, so a stray
# out-of-transaction lazy access fails the same way here as it would in production.
spring.jpa.open-in-view=false
# Match production: batch-fetch EAGER collections application-wide (see application.properties).
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Deterministic seeded admin for tests (no random generated-password logging).
w2s.security.initial-admin.username=admin
w2s.security.initial-admin.password=admin-test-pw
# Stable remember-me key so tests are deterministic (no generated-key warning).
w2s.security.remember-me.key=test-remember-me-key
