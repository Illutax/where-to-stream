<html layout:decorate="~{layout/layout}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <title>My Watchlist</title>
</head>

<body layout:fragment="content">

<div class="alert alert-success" role="alert" th:if="${message}" th:text="${message}"></div>
<div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

<h1>My Watchlist</h1>

<p>
    <span th:text="${status.count}">0</span> title(s) on your watchlist.
    <span th:if="${status.lastImportedAt}">Last import: <span th:text="${status.lastImportedAt}"></span>.</span>
</p>

<h2>Import an IMDb export</h2>
<p class="text-muted">
    Export your watchlist from IMDb as a CSV and upload it here. This replaces your current list
    (titles not in the upload are removed).
</p>
<form method="post" th:action="@{/watchlist/import}" enctype="multipart/form-data" class="d-flex gap-2 align-items-center">
    <input type="file" name="file" accept=".csv" class="form-control" required style="max-width: 24rem;"/>
    <button type="submit" class="btn btn-primary">Import</button>
</form>

<hr/>

<form method="post" th:action="@{/watchlist/clear}" onsubmit="return confirm('Clear your whole watchlist?');">
    <button type="submit" class="btn btn-outline-danger">Clear my watchlist</button>
</form>

</body>
</html>
