server.port=8001
#server.servlet.context-path=/api/v1/
spring.application.name=where-to-stream

#spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.url=jdbc:h2:file:./db/demo
#spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Schema is owned by Liquibase (classpath:/db/changelog/db.changelog-master.yaml); the XML
# changelog provisions both H2 and MariaDB. Hibernate neither creates nor validates the schema
# (portable types differ per dialect); correctness is covered by the repository tests.
spring.jpa.hibernate.ddl-auto=none

# Every EAGER association in this codebase (see ADR-0011) uses Hibernate's default
# FetchMode.SELECT, which issues one round trip per parent row when a batch of rows is loaded
# (e.g. QueryMeta.queries, QueryResultDB.availabilities) — invisible over embedded H2, a real
# cost over a networked DB. This batches those into WHERE ... IN (...) chunks application-wide,
# so any current or future EAGER collection benefits without an explicit @BatchSize per field.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Disable Open-Session-in-View: this is a JSON API returning DTOs (no server-side view rendering)
# and every association is EAGER, so there is nothing to lazy-load outside a transaction. Keeping
# the persistence context (and potentially a connection) bound to the whole request buys nothing
# and only masks stray out-of-transaction DB access; disabling it keeps DB work inside the service
# layer and silences the startup warning.
spring.jpa.open-in-view=false


# Be polite to werstreamt.es: cap outbound scrape requests per second (<= 0 disables).
wer-streamt.rate-limit.requests-per-second=20

# Poster images. By default the poster URL is looked up via IMDb's GraphQL API (imdb-poster.api-url,
# default https://api.graphql.imdb.com/) and both sizes are served pre-sized from Amazon's image
# CDN. The API + CDN tolerate a healthy rate; keep it polite but not glacial.
imdb-poster.rate-limit.requests-per-second=10
# See exactly which poster resource each request fetches (lookup page + image CDN URL):
# logging.level.tech.dobler.where2stream.titlecatalog=DEBUG
# poster.negative-cache-days=14
# Opt in to TMDB as the poster source instead (adds the required TMDB attribution footer): set the
# flag AND a v3 API key. env TMDB_ENABLED / TMDB_API_KEY; with either missing, IMDb stays the source.
tmdb.enabled=${TMDB_ENABLED:false}
# tmdb.api-key=

# Navbar title search, backed by IMDb's public suggestion/typeahead endpoint. Hit on every
# debounced keystroke (not once per title like imdb-poster above). This is one global limit
# shared across every user's search, not a per-user cap — sized to comfortably cover several
# concurrent users typing (each individually capped by the frontend's own debounce) while still
# bounding the aggregate outbound rate.
imdb-search.rate-limit.requests-per-second=5
# imdb-search.max-results=8

# eBay purchase offers (cheapest fixed-price offer and cheapest running auction per title).
# Opt-in like TMDB: needs the flag AND both credentials, otherwise the feature stays off.
# env EBAY_ENABLED / EBAY_CLIENT_ID / EBAY_CLIENT_SECRET — see .env.example.
# The credentials are deliberately not written here; they belong in the environment (plan 5.4).
ebay.enabled=${EBAY_ENABLED:false}
ebay.default-marketplace=${EBAY_DEFAULT_MARKETPLACE:EBAY_DE}
# The shared daily call budget is small (5000/day for the whole application, see ADR-0017), so the
# outbound rate is kept low on purpose — this is politeness, not the budget guard.
ebay.rate-limit.requests-per-second=2
# Category the search is restricted to (DVDs & Blu-ray on ebay.de). Without it "Heat" mostly
# returns heating supplies.
# ebay.category-id=617
# ebay.results-per-query=3
# Daily call budget (ADR-0017). The ceiling is the full allowance on purpose, not a margin below
# it — the guard against miscounting is eBay's own quota response, not a buffer.
# ebay.quota.daily-call-budget=5000
# Per-user share is budget * overbooking / n. At 2 the budget is knowingly handed out twice over,
# assuming at most half the registered users fetch prices on a given day.
# ebay.quota.per-user-overbooking=2
# WHEN eBay's allowance rolls over is an UNVERIFIED hypothesis ("12 o'clock Pacific", source: a
# Gemini answer, ambiguous between noon and midnight). Both values are configuration so a wrong
# guess costs a config change, not a release. A zone, never a fixed offset — Pacific time observes
# daylight saving, and a fixed offset would be an hour wrong for half the year.
# ebay.quota.reset-zone=America/Los_Angeles
# ebay.quota.reset-time=00:00

# Write application logs to ./logs (gitignored); console logging stays enabled.
logging.file.name=logs/w2s.log

# HTTP session idle timeout (override e.g. SERVER_SERVLET_SESSION_TIMEOUT=2h).
server.servlet.session.timeout=30m
# Sessions are persisted in the DB (Spring Session JDBC) so they survive restarts. The schema is
# owned by Liquibase (005-spring-session), so Spring Session must not try to create it.
spring.session.jdbc.initialize-schema=never
# Persistent "stay signed in" survives browser close and — with a STABLE key — server restarts.
# Set a real secret in production so cron-driven redeploys don't log everyone out:
#   W2S_SECURITY_REMEMBER_ME_KEY=<a long random secret>
# w2s.security.remember-me.key=